<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Hotspot | Enzee Works</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Gaya dasar untuk efek 'Cool & Misterius' */
        body {
            background-color: #0f172a; /* Slate 900 */
            background-image: radial-gradient(circle at top right, #1e293b, transparent),
                              radial-gradient(circle at bottom left, #020617, transparent);
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Efek kaca (Glassmorphism) */
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        /* Animasi loading sederhana */
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: #38bdf8;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel rounded-2xl w-full max-w-md p-8 relative overflow-hidden">
        
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-sky-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>

        <div class="relative z-10">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold tracking-wider text-white mb-2">ACCESS<span class="text-sky-400">.</span>PORTAL</h1>
                <p class="text-sm text-slate-400">Masukkan kode voucher Anda untuk memulai sesi.</p>
            </div>

            <div id="alert-box" class="hidden mb-6 p-4 rounded-lg text-sm border font-medium text-center transition-all duration-300">
                <span id="alert-message">Pesan error di sini</span>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="voucher_code" class="block text-xs uppercase tracking-widest text-slate-400 mb-2">Kode Voucher</label>
                    <input 
                        type="text" 
                        id="voucher_code" 
                        required
                        autocomplete="off"
                        class="w-full bg-slate-900/50 border border-slate-700 text-white text-lg text-center tracking-widest rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 block p-3 transition-colors outline-none uppercase" 
                        placeholder="••••••••"
                    >
                </div>
                
                <input type="hidden" id="mac_address" value="">

                <button 
                    type="submit" 
                    id="submit-btn"
                    class="w-full text-white bg-sky-600 hover:bg-sky-500 focus:ring-4 focus:outline-none focus:ring-sky-900 font-medium rounded-lg text-sm px-5 py-3.5 text-center tracking-wider transition-all shadow-lg shadow-sky-900/20"
                >
                    <span id="btn-text">CONNECT</span>
                </button>
            </form>
            
            <div class="mt-8 text-center">
                <p class="text-xs text-slate-500">&copy; 2026 Kelompok 5 - Vires In Numeris</p>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const form = document.getElementById('loginForm');
        const voucherInput = document.getElementById('voucher_code');
        const macInput = document.getElementById('mac_address');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const alertBox = document.getElementById('alert-box');
        const alertMsg = document.getElementById('alert-message');

        // Fungsi Helper: Ambil MAC Address dari URL Mikrotik (jika ada)
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Set MAC Address. Jika dibuka di laptop Yoga, gunakan MAC testing. 
        // Jika dibuka dari Mikrotik, ambil dari URL ?mac=...
        const macFromUrl = getQueryParam('mac');
        macInput.value = macFromUrl ? macFromUrl : "AA:BB:CC:DD:EE:FF"; // Fallback ke MAC Testing kita tadi

        // Fungsi Helper: Tampilkan Notifikasi
        function showAlert(message, type) {
            alertBox.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/50', 'text-red-400', 'bg-green-500/10', 'border-green-500/50', 'text-green-400');
            
            if (type === 'error') {
                alertBox.classList.add('bg-red-500/10', 'border-red-500/50', 'text-red-400');
            } else {
                alertBox.classList.add('bg-green-500/10', 'border-green-500/50', 'text-green-400');
            }
            
            alertMsg.innerText = message;
        }

        // Eksekusi Login
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const voucherCode = voucherInput.value.trim().toUpperCase();
            
            // UI State: Loading
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            btnText.innerHTML = '<div class="spinner"></div> AUTHENTICATING...';
            alertBox.classList.add('hidden');

            try {
                // Tembak API Golang Qori
                const response = await fetch('http://127.0.0.1:3000/api/v1/portal/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        voucher_code: voucherCode,
                        mac_address: macInput.value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Terjadi kesalahan pada server.');
                }

                // UI State: Sukses
                showAlert(`Akses Diberikan. Waktu aktif: ${data.data.duration_minutes} Menit.`, 'success');
                btnText.innerText = 'CONNECTED';
                submitBtn.classList.replace('bg-sky-600', 'bg-green-600');
                
                // Jika ini adalah Mikrotik asli, kita harus melakukan POST ke halaman login Mikrotik yang asli
                // Namun untuk testing saat ini, kita cukup tampilkan sukses.
                setTimeout(() => {
                    // window.location.href = "http://192.168.10.1/status"; // Redirect Mikrotik
                    console.log("Sesi dimulai:", data.data);
                }, 1500);

            } catch (error) {
                // UI State: Gagal
                showAlert(error.message, 'error');
                
                // Reset Button
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                btnText.innerText = 'CONNECT';
            }
        });
    </script>
</body>
</html>
