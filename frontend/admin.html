<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Enzee Works</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">

    <div id="login-section" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950">
        <div class="glass p-8 rounded-2xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center tracking-widest">ADMIN<span class="text-sky-500">.PORTAL</span></h2>
            <div class="space-y-4">
                <input type="text" id="user" placeholder="Username" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 outline-none focus:border-sky-500 text-center tracking-widest">
                <input type="password" id="pass" placeholder="Password" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 outline-none focus:border-sky-500 text-center tracking-widest">
                <button onclick="handleLogin()" id="btn-login" class="w-full bg-sky-600 hover:bg-sky-500 p-3 rounded-lg font-bold transition tracking-widest">MASUK</button>
            </div>
        </div>
    </div>

    <div id="main-section" class="hidden">
        <nav class="p-4 border-b border-slate-800 flex justify-between items-center glass sticky top-0 z-40">
            <h1 class="font-bold text-xl tracking-tighter">ENZEE<span class="text-sky-500">.WORKS</span></h1>
            <div class="flex gap-4">
                <button onclick="switchTab('dashboard')" class="text-sm hover:text-sky-400 uppercase tracking-widest">Stats</button>
                <button onclick="switchTab('vouchers')" class="text-sm hover:text-sky-400 uppercase tracking-widest">Vouchers</button>
                <button onclick="handleLogout()" class="text-sm text-red-400 uppercase tracking-widest">Logout</button>
            </div>
        </nav>

        <main class="p-6 max-w-6xl mx-auto">
            <div id="dashboard" class="tab-content active space-y-6">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="stats-container">
                    <div class="glass p-4 rounded-xl border-l-4 border-sky-500">
                        <p class="text-slate-400 text-xs uppercase tracking-widest">Total Voucher</p>
                        <h3 id="stat-total" class="text-3xl font-bold mt-2">0</h3>
                    </div>
                    <div class="glass p-4 rounded-xl border-l-4 border-green-500">
                        <p class="text-slate-400 text-xs uppercase tracking-widest">Sedang Aktif</p>
                        <h3 id="stat-active" class="text-3xl font-bold mt-2">0</h3>
                    </div>
                    <div class="glass p-4 rounded-xl border-l-4 border-slate-500">
                        <p class="text-slate-400 text-xs uppercase tracking-widest">Belum Dipakai</p>
                        <h3 id="stat-unused" class="text-3xl font-bold mt-2">0</h3>
                    </div>
                    <div class="glass p-4 rounded-xl border-l-4 border-red-500">
                        <p class="text-slate-400 text-xs uppercase tracking-widest">Kedaluwarsa</p>
                        <h3 id="stat-expired" class="text-3xl font-bold mt-2">0</h3>
                    </div>
                </div>
                
                <div class="glass p-6 rounded-2xl flex flex-wrap items-end justify-between gap-4 border border-slate-700">
                    <div>
                        <h2 class="text-sm font-bold mb-3 text-slate-400 uppercase tracking-widest">Buat Voucher Baru</h2>
                        <div class="flex flex-wrap gap-2">
                            <input type="number" id="gen-qty" placeholder="Qty" class="bg-slate-900 border border-slate-700 p-2 rounded-lg w-20 text-center outline-none focus:border-sky-500">
                            <input type="number" id="gen-dur" placeholder="Menit" class="bg-slate-900 border border-slate-700 p-2 rounded-lg w-24 text-center outline-none focus:border-sky-500">
                            <button onclick="handleGenerate()" id="btn-gen" class="bg-sky-600 hover:bg-sky-500 px-6 py-2 rounded-lg font-bold transition">CETAK DATA</button>
                        </div>
                    </div>
                    
                    <div>
                        <h2 class="text-sm font-bold mb-3 text-slate-400 uppercase tracking-widest text-right">Cetak Tiket Fisik</h2>
                        <button onclick="handleExportPDF()" id="btn-pdf" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-lg font-bold transition flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                            </svg>
                            UNDUH PDF
                        </button>
                    </div>
                </div>
            </div>

            <div id="vouchers" class="tab-content">
                <div class="glass rounded-2xl overflow-hidden border border-slate-700">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900 text-slate-400 uppercase text-[10px] tracking-widest">
                            <tr>
                                <th class="p-4">Kode Akses</th>
                                <th class="p-4">Durasi</th>
                                <th class="p-4">Status</th>
                                <th class="p-4 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="voucher-table-body" class="divide-y divide-slate-800">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:3000/api/v1";
        let TOKEN = localStorage.getItem('admin_token');

        // Init: Cek token saat halaman dimuat
        window.onload = () => { if (TOKEN) showMain(); };

        function showMain() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            loadStats();
            loadVouchers();
        }

        async function handleLogin() {
            const btn = document.getElementById('btn-login');
            btn.innerHTML = "LOADING...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: document.getElementById('user').value, 
                        password: document.getElementById('pass').value 
                    })
                });
                const d = await res.json();
                
                if (d.status === "success") {
                    TOKEN = d.data.token;
                    localStorage.setItem('admin_token', TOKEN);
                    showMain();
                } else {
                    alert("Akses Ditolak: " + d.message);
                }
            } catch(e) {
                alert("Gagal menghubungi server.");
            } finally {
                btn.innerHTML = "MASUK";
                btn.disabled = false;
            }
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/admin/stats`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const d = await res.json();
                if(d.status === "success") {
                    document.getElementById('stat-total').innerText = d.data.total_vouchers;
                    document.getElementById('stat-active').innerText = d.data.active;
                    document.getElementById('stat-unused').innerText = d.data.unused;
                    document.getElementById('stat-expired').innerText = d.data.expired;
                }
            } catch(e) { console.error("Stats Error:", e); }
        }

        async function loadVouchers() {
            try {
                const res = await fetch(`${API_BASE}/admin/vouchers`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const d = await res.json();
                if(d.status === "success") {
                    const body = document.getElementById('voucher-table-body');
                    body.innerHTML = d.data.map(v => {
                        let statusColor = "bg-slate-800 text-slate-300";
                        if(v.status === 'active') statusColor = "bg-green-900/50 text-green-400 border border-green-800";
                        if(v.status === 'expired') statusColor = "bg-red-900/50 text-red-400 border border-red-800";
                        
                        return `
                        <tr class="hover:bg-slate-900/50 transition">
                            <td class="p-4 font-mono text-sky-400 font-bold tracking-widest text-lg">${v.code}</td>
                            <td class="p-4 text-slate-300">${v.duration_minutes} Menit</td>
                            <td class="p-4"><span class="px-2 py-1 rounded text-[10px] uppercase font-bold tracking-wider ${statusColor}">${v.status}</span></td>
                            <td class="p-4 text-right">
                                <button onclick="deleteVoucher(${v.voucher_id})" class="text-xs text-red-500 hover:text-red-400 hover:underline">HAPUS</button>
                            </td>
                        </tr>
                        `;
                    }).join('');
                }
            } catch(e) { console.error("Vouchers Error:", e); }
        }

        async function handleGenerate() {
            const qty = document.getElementById('gen-qty').value;
            const dur = document.getElementById('gen-dur').value;
            if(!qty || !dur) return alert("Isi qty dan durasi");

            const btn = document.getElementById('btn-gen');
            btn.innerHTML = "MEMPROSES...";
            btn.disabled = true;
            
            try {
                await fetch(`${API_BASE}/admin/vouchers/generate`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${TOKEN}` 
                    },
                    body: JSON.stringify({ qty: parseInt(qty), duration_minutes: parseInt(dur), admin_id: 1 })
                });
                document.getElementById('gen-qty').value = '';
                document.getElementById('gen-dur').value = '';
                loadStats();
                loadVouchers();
            } finally {
                btn.innerHTML = "CETAK DATA";
                btn.disabled = false;
            }
        }

        // --- LOGIKA FETCH BLOB PDF (SERVER-SIDE RENDERING) ---
        async function handleExportPDF() {
            const btn = document.getElementById('btn-pdf');
            const originalText = btn.innerHTML;
            btn.innerHTML = "GENERATING...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/admin/vouchers/export-pdf`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });

                if (!res.ok) throw new Error("Gagal generate PDF. Cek log server Golang.");

                // Konversi stream ke Blob
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                
                // Pemicu Unduh Otomatis
                const a = document.createElement('a');
                a.href = url;
                a.download = `Voucher_Warkop_Fahar_${new Date().getTime()}.pdf`;
                document.body.appendChild(a);
                a.click();
                
                // Bersihkan memori DOM
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function deleteVoucher(id) {
            if(!confirm("Yakin ingin menghapus voucher ini secara permanen?")) return;
            await fetch(`${API_BASE}/admin/vouchers/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${TOKEN}` }
            });
            loadVouchers();
            loadStats();
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function handleLogout() {
            localStorage.removeItem('admin_token');
            location.reload();
        }
    </script>
</body>
</html>
