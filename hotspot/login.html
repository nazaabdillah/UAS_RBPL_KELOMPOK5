<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="-1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>voucher.net</title>
  <style>
    *{margin:0;padding:0;border:0;box-sizing:border-box}
    html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;background:#070b10;color:#eef2f7;overflow-x:hidden}
    body{background-image:radial-gradient(ellipse 90% 55% at 50% -5%,rgba(0,200,180,.14) 0%,transparent 65%),radial-gradient(ellipse 60% 45% at 95% 85%,rgba(100,80,220,.11) 0%,transparent 60%)}
    table.center-wrap{width:100%;min-height:100vh;border-collapse:collapse}
    table.center-wrap td{vertical-align:middle;padding:30px 16px}
    .wrap{width:100%;max-width:400px;margin:0 auto}
    .brand{text-align:center;margin-bottom:26px}
    .brand-row{display:inline-block;vertical-align:middle;margin-bottom:8px}
    .brand-icon{display:inline-block;vertical-align:middle;width:34px;height:34px;background:#0043d2;border-radius:9px;color:#060e14;font-size:17px;font-weight:800;line-height:34px;text-align:center;margin-right:9px}
    .brand-name{display:inline-block;vertical-align:middle;font-size:24px;font-weight:800;color:#eef2f7;letter-spacing:-0.5px}
    .brand-name span{color:#0745d4}
    .brand-tag{display:block;font-size:11px;color:#556070;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
    .card{background:#111827;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:34px 30px;position:relative;-webkit-box-shadow:0 20px 60px rgba(0,0,0,.6);box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .card-top-line{height:1px;background:#004ad2;opacity:.4;margin:-34px -30px 28px;position:relative;top:0}
    .page-title{font-size:17px;font-weight:700;color:#eef2f7;margin-bottom:5px}
    .page-sub{font-size:13px;color:#6b7a96;margin-bottom:22px;line-height:1.5}
    .alert-err{background:rgba(255,60,85,.1);border:1px solid rgba(255,60,85,.3);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:#ff5070;line-height:1.5}
    .field{margin-bottom:14px}
    .field-lbl{display:block;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#6b7a96;margin-bottom:6px}
    input[type=text],input[type=password]{width:100%;height:46px;background:#1a2235;border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#eef2f7;font-family:inherit;font-size:14px;padding:0 14px;outline:none;-webkit-appearance:none;appearance:none;-webkit-transition:border-color .2s,box-shadow .2s;transition:border-color .2s,box-shadow .2s}
    input[type=text]:focus,input[type=password]:focus{border-color:rgba(0, 112, 210, 0.55);background:#1e2d42;-webkit-box-shadow:0 0 0 3px rgba(0,210,190,.15);box-shadow:0 0 0 3px rgba(0,210,190,.15)}
    input[type=text]::-webkit-input-placeholder,input[type=password]::-webkit-input-placeholder{color:#3a4558}
    input[type=text]:-ms-input-placeholder,input[type=password]:-ms-input-placeholder{color:#3a4558}
    input[type=text]::placeholder,input[type=password]::placeholder{color:#3a4558}
    input[type=submit]{display:block;width:100%;height:48px;margin-top:10px;background:#0843d8;color:#060e14;font-family:inherit;font-size:15px;font-weight:700;border:none;border-radius:8px;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-transition:opacity .2s;transition:opacity .2s}
    input[type=submit]:hover{opacity:.88}
    .btn-trial{display:block;width:100%;height:46px;line-height:46px;text-align:center;background:rgba(255,255,255,.05);color:#eef2f7;font-family:inherit;font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,.09);border-radius:8px;cursor:pointer;text-decoration:none;margin-top:10px}
    .divider{text-align:center;font-size:11px;color:#3a4558;margin:14px 0;position:relative}
    .divider:before,.divider:after{content:'';position:absolute;top:50%;width:40%;height:1px;background:rgba(255,255,255,.07)}
    .divider:before{left:0}.divider:after{right:0}
    .footer{text-align:center;margin-top:20px;font-size:11px;color:#3a4558}
    .footer a{color:#556070;text-decoration:none}
    @media(max-width:480px){.card{padding:26px 20px;border-radius:12px}}
  </style>
</head>
<body>

  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post" style="display:none">
    <input type="hidden" name="username" />
    <input type="hidden" name="password" />
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
  </form>
  <script src="/md5.js"></script>
  <script>
    function doLogin() {
      document.sendin.username.value = document.login.username.value;
      document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
      document.sendin.submit();
      return false;
    }
  </script>
  $(endif)

  <table class="center-wrap"><tr><td>
  <div class="wrap">

    <div class="brand">
      <div class="brand-row">
        <div class="brand-icon">V</div>
        <div class="brand-name">voucher<span>.</span>net</div>
      </div>
      <span class="brand-tag">Wireless Internet Access</span>
    </div>

    <div class="card">
      <div class="card-top-line"></div>

      $(if error)
      <div class="alert-err">$(error)</div>
      $(endif)

      <div class="page-title">Masuk ke Jaringan</div>
      <p class="page-sub">Gunakan kode voucher sebagai username &amp; password.</p>

      <form name="login" action="$(link-login-only)" method="post" $(if chap-id)onSubmit="return doLogin()"$(endif)>
        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />

        <div class="field">
          <label class="field-lbl" for="u">Username</label>
          <input id="u" type="text" name="username" value="$(username)"
            placeholder="Masukkan username" autocomplete="username"
            autocapitalize="none" spellcheck="false" />
        </div>

        <div class="field">
          <label class="field-lbl" for="p">Password</label>
          <input id="p" type="password" name="password"
            placeholder="Masukkan password" autocomplete="current-password" />
        </div>

        <input type="submit" value="Sambungkan" />
      </form>

      $(if trial == 'yes')
      <div class="divider">atau</div>
      <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)" class="btn-trial">Akses Trial Gratis</a>
      $(endif)
    </div>

    <p class="footer">Powered by <a href="#">MikroTik RouterOS</a> &nbsp;&middot;&nbsp; &copy; voucher.net</p>

  </div>
  </td></tr></table>

</body>
</html>
