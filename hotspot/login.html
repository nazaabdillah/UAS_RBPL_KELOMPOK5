<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="-1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>voucher.net</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;background:#1c1438;color:#eef2f7;overflow-x:hidden}
body{background-image:radial-gradient(ellipse 80% 55% at 50% -5%,rgba(0,210,190,0.12) 0%,transparent 70%),radial-gradient(ellipse 60% 45% at 95% 85%,rgba(60,100,240,0.08) 0%,transparent 60%);background-attachment:fixed}
.center-wrap{width:100%;min-height:100vh;border-collapse:collapse}
.center-wrap td{vertical-align:middle;padding:30px 20px}
.wrap{max-width:420px;width:100%;margin:0 auto}
.brand{text-align:center;margin-bottom:24px}
.brand-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.brand-icon{background:linear-gradient(145deg,#0a4ad2,#002a8c);width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;box-shadow:0 6px 12px rgba(0,0,0,0.3)}
.brand-name{font-size:26px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,#fff,#b0c8ff);background-clip:text;-webkit-background-clip:text;color:transparent}
.brand-name span{background:linear-gradient(135deg,#4a7eff,#0037b3);background-clip:text;-webkit-background-clip:text;color:transparent}
.brand-tag{display:inline-block;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#7c8aa8;border-top:1px solid rgba(255,255,255,0.08);padding-top:8px}
.card{background:rgba(17,24,39,0.94);backdrop-filter:blur(2px);border:1px solid rgba(17, 8, 35, 0.37);border-radius:28px;padding:32px 28px;box-shadow:0 25px 45px -12px rgba(0,0,0,0.6)}
.card-top-line{height:3px;background:linear-gradient(90deg,#00c8b4,#2b5eff,#00c8b4);border-radius:28px 28px 0 0;margin:-32px -28px 28px}
.page-title{font-size:20px;font-weight:700;margin-bottom:6px;letter-spacing:-0.3px}
.page-sub{font-size:13px;color:#9aabcf;margin-bottom:26px;line-height:1.45}
.alert-err{background:rgba(255,70,95,0.12);border-left:4px solid #ff5070;border-radius:12px;padding:12px 16px;margin-bottom:22px;font-size:13px;color:#ff8aa2;font-weight:500}
.field{margin-bottom:18px}
.field-lbl{display:block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#8e9ec2;margin-bottom:8px}
input[type="text"],input[type="password"]{width:100%;height:52px;background:#0f1522;border:1px solid rgba(255,255,255,0.08);border-radius:16px;color:#f0f4ff;font-family:inherit;font-size:14px;padding:0 18px;outline:none;transition:all 0.2s ease}
input[type="text"]:focus,input[type="password"]:focus{border-color:#1fbaaa;background:#131b2d;box-shadow:0 0 0 3px rgba(0,200,180,0.2)}
input[type="text"]::placeholder,input[type="password"]::placeholder{color:#3f4a68}
input[type="submit"]{width:100%;height:52px;background:linear-gradient(100deg,#0c4fe0,#0037b3);border:none;border-radius:28px;color:#fff;font-family:inherit;font-size:15px;font-weight:700;margin-top:14px;cursor:pointer;transition:all 0.2s;box-shadow:0 8px 18px rgba(0,55,160,0.3)}
input[type="submit"]:hover{background:linear-gradient(100deg,#1f5eff,#0044cc);transform:translateY(-1px)}
input[type="submit"]:active{transform:translateY(1px)}
.btn-trial{display:block;width:100%;padding:14px 0;text-align:center;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.1);border-radius:28px;color:#cbd5f0;font-family:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;transition:all 0.2s;margin-top:8px}
.btn-trial:hover{background:rgba(0,210,180,0.1);border-color:#2bcaba;color:#bcf2ec}
.divider{text-align:center;font-size:11px;color:#4c5b7c;margin:20px 0 16px;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:41%;height:1px;background:rgba(255,255,255,0.06)}
.divider::before{left:0}
.divider::after{right:0}
.footer{text-align:center;margin-top:24px;font-size:10px;color:#4a577a}
.footer a{color:#6b7c9e;text-decoration:none;transition:color 0.2s}
.footer a:hover{color:#00c8b4}
@media(max-width:500px){.center-wrap td{padding:20px 16px}.card{padding:26px 20px;border-radius:24px}.card-top-line{margin:-26px -20px 24px}.brand-name{font-size:22px}.brand-icon{width:38px;height:38px;font-size:18px}.page-title{font-size:18px}input[type="text"],input[type="password"],input[type="submit"]{height:48px}}
form[name="sendin"]{display:none}
</style>
</head>
<body>


<form name="sendin" action="$(link-login-only)" method="post" style="display:none">
<input type="hidden" name="username" />
<input type="hidden" name="password" />
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />
</form>
<script src="/md5.js"></script>
<script>
function doLogin() {
  document.sendin.username.value = document.login.username.value;
  document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>


<table class="center-wrap"><tr>
<td>
<div class="wrap">

<div class="brand">
<div class="brand-row">
<div class="brand-icon">V</div>
<div class="brand-name">voucher<span>.</span>net</div>
</div>
<span class="brand-tag">Wireless Internet Access</span>
</div>

<div class="card">
<div class="card-top-line"></div>


<div class="alert-err"></div>


<div class="page-title">Masuk ke Jaringan</div>
<p class="page-sub">Gunakan kode voucher sebagai username &amp; password.</p>

<form name="login" action="$(link-login-only)" method="post" $(if chap-id)onSubmit="return doLogin()"$(endif)>
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />

<div class="field">
<label class="field-lbl" for="u">Username</label>
<input id="u" type="text" name="username"  placeholder="Masukkan username" autocomplete="username" autocapitalize="none" spellcheck="false" />
</div>

<div class="field">
<label class="field-lbl" for="p">Password</label>
<input id="p" type="password" name="password" placeholder="Masukkan password" autocomplete="current-password" />
</div>

<input type="submit" value="Sambungkan" />
</form>


<div class="divider">atau</div>
<a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)" class="btn-trial">Akses Trial Gratis</a>

</div>

<p class="footer">Powered by <a href="#">MikroTik RouterOS</a> &nbsp;&middot;&nbsp; &copy; voucher.net</p>

</div>
</td>
</tr>
</table>

</body>
</html>
